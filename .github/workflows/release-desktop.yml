name: Package native desktop
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify identity and tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' assets/macos/Info.plist)
          test "$GITHUB_REF_TYPE" != tag || test "${GITHUB_REF_NAME#v}" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' assets/macos/Info.plist)" = com.lizhian.agentmanager
      - name: Check and package
        run: |
          scripts/check.sh
          scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-manager-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
