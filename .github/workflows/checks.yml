name: Go native checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify macOS ARM64 checks and package
        run: |
          test "$(uname -m)" = arm64
          scripts/check.sh
          scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-manager-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
